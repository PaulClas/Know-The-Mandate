name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install uv && uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev,postgres]"
      - run: .venv/bin/ruff check apps tests scripts examples
      - run: .venv/bin/python -m pytest tests --cov --cov-report=term --cov-report=xml
      - run: PYTHONPATH=apps/api .venv/bin/python -m kym.cli scenarios
        env: { KYM_DATA_DIR: /tmp/kym-ci }
      - run: PYTHONPATH=apps/api .venv/bin/python -m kym.cli redteam
        env: { KYM_DATA_DIR: /tmp/kym-ci-redteam }
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with: { name: coverage-xml, path: coverage.xml }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install uv && uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium
      - run: |
          PYTHONPATH=apps/api .venv/bin/python -m uvicorn kym.app:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          cd apps/web && npm run build && (npm run start &) && sleep 8 && npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: python3 scripts/docker_smoke.py
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v

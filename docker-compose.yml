# Local demo only. Binds to localhost; uses demo secrets from .env.example. Do NOT expose publicly.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kym
      POSTGRES_USER: kym
      POSTGRES_PASSWORD: ${KYM_POSTGRES_PASSWORD:-kym-demo-only}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kym -d kym"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: { context: ., dockerfile: docker/Dockerfile.api }
    environment:
      KYM_DATABASE_URL: postgresql+psycopg://kym:${KYM_POSTGRES_PASSWORD:-kym-demo-only}@postgres:5432/kym
      KYM_DATA_DIR: /data
      KYM_DEMO_SESSION_SECRET: ${KYM_DEMO_SESSION_SECRET:-demo-only-session-secret-do-not-use-in-production}
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    volumes: [kymdata:/data]

  web:
    build: { context: apps/web, dockerfile: Dockerfile }
    environment:
      KYM_API_URL: http://api:8000
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata: {}
  kymdata: {}
